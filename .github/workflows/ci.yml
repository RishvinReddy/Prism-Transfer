name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Type Check & Lint
      run: |
        npx tsc --noEmit
        npm run lint || echo "Linting step added but not strictly enforced yet"

    - name: Build
      run: npm run build

    - name: Unit Tests & Verification Harness
      run: npx vitest run tests/unit tests/harness

    # In the future, we can add a specific step for Playwright:
    # - name: Install Playwright Browsers
    #   run: npx playwright install --with-deps
    # - name: Browser Validation (Playwright)
    #   run: npx playwright test
